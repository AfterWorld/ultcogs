name: OnePieceGuess tests
on:
  pull_request:
    paths: ['onepieceguess/**', '.github/workflows/onepieceguess.yml']
  push:
    paths: ['onepieceguess/**', '.github/workflows/onepieceguess.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile onepieceguess/*.py
      - run: python -m unittest onepieceguess.test_game
      - run: python -m json.tool onepieceguess/info.json > /dev/null
