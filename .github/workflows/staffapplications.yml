name: Staff application regression tests
on:
  pull_request:
    paths: ['staffapplications/**', '.github/workflows/staffapplications.yml']
  push:
    paths: ['staffapplications/**', '.github/workflows/staffapplications.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r staffapplications/requirements-dev.txt
      - name: Lint
        run: python -m ruff check --config staffapplications/ruff.toml staffapplications
      - name: Format
        run: python -m ruff format --check --config staffapplications/ruff.toml staffapplications
      - name: Test with real Red and discord.py dependencies
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -p pytest_asyncio.plugin -c staffapplications/pytest.ini --confcutdir=staffapplications/tests staffapplications/tests -q
