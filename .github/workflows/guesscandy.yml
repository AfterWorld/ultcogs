name: GuessCandy regression tests
on:
  pull_request:
    paths: ['guesscandy/**', '.github/workflows/guesscandy.yml']
  push:
    paths: ['guesscandy/**', '.github/workflows/guesscandy.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r guesscandy/requirements-dev.txt
      - name: Test the cog and all bundled photos
        run: python guesscandy/test_game.py
